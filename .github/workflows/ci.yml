name: CI

on:
  push:
     branches: ['master']
  pull_request:
	branches: ['master']

jobs:
  build:
	runs-on: windows-latest
	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Setup .NET
		uses: actions/setup-dotnet@v4
		with:
		  dotnet-version: '7.0.x'

	  - name: Restore
		run: dotnet restore

	  - name: Build
		run: dotnet build -c Release --no-restore

	  - name: Test
		run: dotnet test --no-build --verbosity normal

	  - name: Publish win-x64
		run: dotnet publish -c Release -r win-x64 --self-contained false -o ./publish/win-x64 --no-build

	  - name: Upload publish (win-x64)
		uses: actions/upload-artifact@v4
		with:
		  name: publish-win-x64
		  path: publish/win-x64
